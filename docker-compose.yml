services:
  lidarr-downloader:
    # Every build takes the newest base image, packages and libraries
    # (`docker compose up -d --build`); cached layers would freeze them.
    build:
      context: .
      pull: true
      no_cache: true
    container_name: lidarr-downloader
    restart: unless-stopped
    volumes:
      - ${HOST_DOWNLOAD_PATH:?err}:${DOWNLOAD_PATH:?err}
      - ${HOST_MUSIC_PATH:?err}:/music
      - ${HOST_CONFIG:?err}:/config
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - LIDARR_URL=${LIDARR_URL:?err}
      - LIDARR_API_KEY=${LIDARR_API_KEY:?err}
      - DOWNLOAD_PATH=${DOWNLOAD_PATH:?err}
      # The library as this container sees it: the /music mount above. Only
      # override it with another path that is mounted here too.
      - LIDARR_PATH=${LIDARR_PATH:-/music}
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY:-}
      # Automatic YouTube PO tokens via the bgutil provider sidecar below.
      # Set YT_POT_PROVIDER_URL="" to disable (and drop the sidecar).
      - YT_POT_PROVIDER_URL=${YT_POT_PROVIDER_URL:-http://bgutil-provider:4416}
    # Published on the whole LAN: Lidarr on another host reaches the
    # download-client bridge and phones open the app. There is no login, so
    # keep the port off the internet (no router port-forward).
    ports:
      - "${WEBUI_PORT:?err}:5000"
    depends_on:
      - bgutil-provider

  # Generates YouTube PO tokens so yt-dlp avoids "Sign in to confirm you're
  # not a bot" / format-unavailable errors.
  # https://github.com/Brainicism/bgutil-ytdlp-pot-provider
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    # Always the newest sidecar, matching the bgutil plugin the image installs
    # at its latest version: the two speak one protocol and must move together.
    pull_policy: always
    container_name: bgutil-provider
    restart: unless-stopped
    init: true
