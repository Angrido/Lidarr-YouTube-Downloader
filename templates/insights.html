<!doctype html>
<html lang="en">
<head>
    {% include "_head.html" %}
    <title>Insights — Lidarr YouTube Downloader</title>
    <style>
        .insights-body {
            transition: opacity var(--dur) var(--ease);
        }

        .insights-body.is-refreshing {
            opacity: 0.5;
            pointer-events: none;
        }

        .insights-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: var(--sp-4);
            margin-top: var(--sp-4);
        }

        @media (min-width: 960px) {
            .insights-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .chart-card-wide {
                grid-column: 1 / -1;
            }
        }

        .chart-card {
            display: flex;
            flex-direction: column;
            gap: var(--sp-4);
        }

        .chart-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: var(--sp-3);
        }

        .chart-head .ui-card-title {
            margin: 0;
        }

        .chart-head .ui-btn {
            flex: none;
        }

        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: var(--sp-1) var(--sp-4);
            margin: 0;
            padding: 0;
            list-style: none;
            font-size: var(--text-footnote);
            color: var(--text-2);
        }

        .chart-legend li {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .chart-legend strong {
            color: var(--text-1);
            font-weight: 650;
            font-variant-numeric: tabular-nums;
        }

        .legend-swatch {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            flex: none;
            background: var(--k);
        }

        .k-success { --k: var(--success-mark); }
        .k-failed { --k: var(--danger-mark); }
        .k-accent { --k: var(--accent); }

        .chart-plot {
            position: relative;
            min-height: 120px;
            border-radius: var(--r-sm);
        }

        .chart-plot:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        .chart-svg {
            display: block;
            overflow: visible;
            font-family: var(--font-sans);
        }

        .chart-svg text {
            font-size: 11px;
            fill: var(--text-3);
            font-variant-numeric: tabular-nums;
        }

        .chart-svg .peak-label {
            fill: var(--text-2);
            font-weight: 600;
        }

        .grid-line {
            stroke: var(--separator);
            stroke-width: 1;
            shape-rendering: crispEdges;
        }

        .base-line {
            stroke: var(--separator-strong);
            stroke-width: 1;
            shape-rendering: crispEdges;
        }

        .mark-success { fill: var(--success-mark); }
        .mark-failed { fill: var(--danger-mark); }

        .col-band {
            fill: var(--fill-1);
            opacity: 0;
            transition: opacity var(--dur-fast) var(--ease);
        }

        .col.is-active .col-band {
            opacity: 1;
        }

        .col-hit {
            fill: transparent;
            cursor: default;
        }

        .col-bars {
            transform-box: fill-box;
            transform-origin: 50% 100%;
        }

        .is-animated .col-bars {
            animation: grow-y 520ms var(--ease-out) both;
            animation-delay: var(--d, 0ms);
        }

        .is-animated .peak-label {
            animation: fade-in 240ms var(--ease) 560ms both;
        }

        @keyframes fade-in {
            from { opacity: 0; }
        }

        @keyframes grow-y {
            from { transform: scaleY(0); }
        }

        .donut-wrap {
            display: flex;
            align-items: center;
            gap: var(--sp-6);
            flex-wrap: wrap;
        }

        .donut-plot {
            flex: none;
            width: 168px;
            height: 168px;
        }

        .donut-arc {
            fill: none;
            transition: opacity var(--dur-fast) var(--ease);
        }

        .donut-arc.arc-success { stroke: var(--success-mark); }
        .donut-arc.arc-failed { stroke: var(--danger-mark); }

        .donut-plot.has-active .donut-arc:not(.is-active) {
            opacity: 0.45;
        }

        .donut-center {
            font-weight: 700;
            letter-spacing: -0.02em;
            fill: var(--text-1);
            font-variant-numeric: normal;
        }

        .chart-svg .donut-center {
            fill: var(--text-1);
        }

        .donut-plot text {
            pointer-events: none;
        }

        .is-animated .donut-sweep {
            animation: sweep 900ms var(--ease-out) both;
        }

        @keyframes sweep {
            from { stroke-dashoffset: var(--c); }
            to { stroke-dashoffset: 0; }
        }

        .donut-legend {
            flex: 1 1 180px;
            min-width: 0;
            display: grid;
            gap: var(--sp-2);
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .donut-legend li {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
            font-size: var(--text-subhead);
            color: var(--text-2);
        }

        .donut-legend li > span:nth-child(2) {
            flex: 1;
        }

        .donut-legend .legend-num {
            color: var(--text-1);
            font-weight: 650;
            font-variant-numeric: tabular-nums;
        }

        .donut-legend .legend-pct {
            min-width: 48px;
            text-align: right;
            color: var(--text-3);
            font-size: var(--text-footnote);
            font-variant-numeric: tabular-nums;
        }

        .donut-legend .is-total {
            padding-top: var(--sp-2);
            border-top: 1px solid var(--separator);
        }

        .legend-swatch.is-blank {
            background: transparent;
        }

        .hbars {
            display: grid;
            gap: 2px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .hbar {
            display: grid;
            grid-template-columns: minmax(64px, 34%) minmax(0, 1fr);
            align-items: center;
            gap: var(--sp-3);
            min-height: 28px;
            padding: 0 var(--sp-2);
            margin: 0 calc(var(--sp-2) * -1);
            border-radius: var(--r-xs);
            transition: background var(--dur-fast) var(--ease);
        }

        .hbar.is-active {
            background: var(--fill-1);
        }

        .hbar-label {
            font-size: var(--text-footnote);
            color: var(--text-2);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            unicode-bidi: plaintext;
            text-align: left;
        }

        .hbar-area {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
            min-width: 0;
            border-left: 1px solid var(--separator-strong);
            height: 22px;
        }

        .hbar-fill {
            flex: none;
            width: max(2px, calc((100% - 56px) * var(--p)));
            height: 14px;
            border-radius: 0 4px 4px 0;
            background: var(--accent);
            transform-origin: 0 50%;
        }

        .is-animated .hbar-fill {
            animation: grow-x 560ms var(--ease-out) both;
            animation-delay: var(--d, 0ms);
        }

        @keyframes grow-x {
            from { transform: scaleX(0); }
        }

        .hbar-value {
            font-size: var(--text-footnote);
            color: var(--text-2);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .chart-empty {
            padding: var(--sp-6) 0;
            text-align: center;
            color: var(--text-3);
            font-size: var(--text-subhead);
        }

        .chart-table .ui-table-wrap {
            max-height: 340px;
            overflow: auto;
            box-shadow: var(--hairline);
        }

        .chart-table caption {
            caption-side: top;
            text-align: left;
            padding: var(--sp-2) var(--sp-4);
            color: var(--text-3);
            font-size: var(--text-footnote);
        }

        .chart-tip {
            white-space: normal;
            min-width: 150px;
            max-width: 260px;
        }

        .chart-tip-title {
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 4px;
            overflow-wrap: anywhere;
        }

        .chart-tip-row {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
        }

        .chart-tip-key {
            width: 12px;
            height: 3px;
            border-radius: 2px;
            flex: none;
            background: var(--k, var(--text-3));
        }

        .chart-tip-val {
            font-weight: 700;
            color: var(--text-1);
            font-variant-numeric: tabular-nums;
        }

        .chart-tip-name {
            color: var(--text-3);
        }

        .skel-stat {
            height: 96px;
            border-radius: var(--r-lg);
        }

        .skel-card {
            height: 300px;
            border-radius: var(--r-lg);
        }

        .insights-state {
            background: var(--bg-elevated);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-1), var(--hairline);
        }

        @media (max-width: 560px) {
            .donut-wrap {
                justify-content: center;
            }
            .page-actions,
            .page-actions .ui-segmented {
                width: 100%;
            }
        }
    </style>
</head>
<body class="app">
    {% set active_page = 'insights' %}
    {% include "_nav.html" %}
    <main class="app-main" id="main">
        <div class="app-content">
            {% include "_topbar.html" %}
            <header class="page-header">
                <div class="page-header-text">
                    <h1 class="page-title">Insights</h1>
                    <p class="page-subtitle">Download activity, success rate and audio quality at a glance</p>
                </div>
                <div class="page-actions">
                    <div class="ui-segmented" id="windowSelect" role="group" aria-label="Time range">
                        <button type="button" data-days="7" aria-pressed="false" aria-label="Last 7 days">7 days</button>
                        <button type="button" data-days="30" aria-pressed="true" aria-label="Last 30 days">30 days</button>
                        <button type="button" data-days="90" aria-pressed="false" aria-label="Last 90 days">90 days</button>
                        <button type="button" data-days="365" aria-pressed="false" aria-label="Last year">1 year</button>
                    </div>
                </div>
            </header>

            <p class="sr-only" id="insightsStatus" role="status" aria-live="polite"></p>
            <div class="insights-body" id="insightsBody"></div>
        </div>
    </main>

    <script>
        const RANGE_LABEL = { 7: 'last 7 days', 30: 'last 30 days', 90: 'last 90 days', 365: 'last year' };
        let currentDays = 30;
        let insightsSeq = 0;
        let lastData = null;
        let tip = null;
        let dailyBuckets = [];
        let dailyWidth = 0;
        let resizeObs = null;
        const tableViews = new Set();
        const esc = (s) => UI.escape(s == null ? '' : s);

        function rangeLabel(days) {
            return RANGE_LABEL[days] || ('last ' + days + ' days');
        }

        function fmtInt(n) {
            return (Number(n) || 0).toLocaleString();
        }

        function fmtPct(part, total) {
            if (!total) return '0%';
            const v = part / total * 100;
            return (v >= 10 || v === 0 ? Math.round(v) : v.toFixed(1)) + '%';
        }

        function fmtDuration(seconds) {
            seconds = Math.round(seconds || 0);
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            if (h >= 1) return h + 'h ' + m + 'm';
            if (m >= 1) return m + 'm';
            return seconds + 's';
        }

        function parseDay(s) {
            const p = String(s).split('-').map(Number);
            return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
        }

        function fmtDay(d, withYear) {
            return d.toLocaleDateString(undefined, withYear ? { month: 'short', day: 'numeric', year: 'numeric' } : { month: 'short', day: 'numeric' });
        }

        let measureCtx = null;
        function textWidth(text, size, weight) {
            if (!measureCtx) measureCtx = document.createElement('canvas').getContext('2d');
            measureCtx.font = (weight || 400) + ' ' + size + 'px ' + getComputedStyle(document.body).fontFamily;
            return measureCtx.measureText(String(text)).width;
        }

        function niceScale(max, maxTicks) {
            const raw = Math.max(1, max) / maxTicks;
            const mag = Math.pow(10, Math.floor(Math.log10(raw)));
            const norm = raw / mag;
            const mults = mag >= 10 ? [1, 2, 2.5, 5, 10] : [1, 2, 5, 10];
            const step = Math.max(1, mults.find((m) => norm <= m) * mag);
            return { top: Math.max(step, Math.ceil(Math.max(1, max) / step) * step), step };
        }

        function ensureTip() {
            if (tip && document.body.contains(tip)) return tip;
            tip = document.createElement('div');
            tip.className = 'ui-tooltip chart-tip';
            tip.setAttribute('aria-hidden', 'true');
            document.body.appendChild(tip);
            return tip;
        }

        function showTip(content, x, y) {
            const t = ensureTip();
            t.textContent = '';
            const title = document.createElement('div');
            title.className = 'chart-tip-title';
            title.textContent = content.title;
            t.appendChild(title);
            content.rows.forEach((r) => {
                const row = document.createElement('div');
                row.className = 'chart-tip-row';
                const key = document.createElement('span');
                key.className = 'chart-tip-key' + (r.k ? ' ' + r.k : '');
                const val = document.createElement('span');
                val.className = 'chart-tip-val';
                val.textContent = r.value;
                const name = document.createElement('span');
                name.className = 'chart-tip-name';
                name.textContent = r.name;
                row.append(key, val, name);
                t.appendChild(row);
            });
            t.classList.add('is-visible');
            const tw = t.offsetWidth;
            const th = t.offsetHeight;
            let left = x + 14;
            let top = y - th - 12;
            if (left + tw > window.innerWidth - 8) left = x - tw - 14;
            if (left < 8) left = 8;
            if (top < 8) top = y + 18;
            if (top + th > window.innerHeight - 8) top = window.innerHeight - th - 8;
            t.style.left = left + 'px';
            t.style.top = top + 'px';
        }

        function hideTip() {
            if (tip) tip.classList.remove('is-visible');
        }

        function attachInspector(container, opts) {
            let active = -1;
            const count = () => opts.count();
            function setActive(i, point) {
                const marks = container.querySelectorAll('[data-i]');
                marks.forEach((m) => m.classList.toggle('is-active', Number(m.dataset.i) === i));
                if (opts.onActive) opts.onActive(i);
                active = i;
                if (i < 0) {
                    hideTip();
                    return;
                }
                let x;
                let y;
                if (point) {
                    x = point.x;
                    y = point.y;
                } else {
                    const anchor = opts.anchor ? opts.anchor(i) : container.querySelector('[data-i="' + i + '"]');
                    const r = (anchor || container).getBoundingClientRect();
                    x = r.left + r.width / 2;
                    y = r.top;
                }
                showTip(opts.content(i), x, y);
            }
            container.addEventListener('pointermove', (e) => {
                const m = e.target.closest('[data-i]');
                if (!m || !container.contains(m)) {
                    if (active !== -1) setActive(-1);
                    return;
                }
                setActive(Number(m.dataset.i), { x: e.clientX, y: e.clientY });
            });
            container.addEventListener('pointerleave', () => setActive(-1));
            container.addEventListener('focus', () => {
                if (!count()) return;
                setActive(active >= 0 ? active : (opts.initial ? opts.initial() : 0));
            });
            container.addEventListener('blur', () => setActive(-1));
            container.addEventListener('keydown', (e) => {
                const n = count();
                if (!n) return;
                let i = active < 0 ? 0 : active;
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') i = Math.min(n - 1, i + 1);
                else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') i = Math.max(0, i - 1);
                else if (e.key === 'Home') i = 0;
                else if (e.key === 'End') i = n - 1;
                else if (e.key === 'Escape') {
                    setActive(-1);
                    return;
                } else return;
                e.preventDefault();
                setActive(i);
            });
        }

        function bucketDaily(daily, maxBars) {
            const n = daily.length;
            if (n <= maxBars) {
                return { unit: 'day', buckets: daily.map((d) => {
                    const dt = parseDay(d.date);
                    return { label: fmtDay(dt), full: fmtDay(dt, true), short: fmtDay(dt), success: d.success, failed: d.failed };
                }) };
            }
            const out = [];
            if (Math.ceil(n / 7) <= maxBars) {
                for (let i = 0; i < n; i += 7) {
                    const chunk = daily.slice(i, i + 7);
                    const a = parseDay(chunk[0].date);
                    const b = parseDay(chunk[chunk.length - 1].date);
                    out.push({
                        label: fmtDay(a) + ' – ' + fmtDay(b),
                        full: fmtDay(a) + ' – ' + fmtDay(b, true),
                        short: fmtDay(a),
                        success: chunk.reduce((s, d) => s + d.success, 0),
                        failed: chunk.reduce((s, d) => s + d.failed, 0),
                    });
                }
                return { unit: 'week', buckets: out };
            }
            const byMonth = new Map();
            daily.forEach((d) => {
                const dt = parseDay(d.date);
                const key = dt.getFullYear() + '-' + dt.getMonth();
                if (!byMonth.has(key)) {
                    byMonth.set(key, {
                        label: dt.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }),
                        full: dt.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }),
                        short: dt.toLocaleDateString(undefined, { month: 'short' }),
                        success: 0,
                        failed: 0,
                    });
                }
                const m = byMonth.get(key);
                m.success += d.success;
                m.failed += d.failed;
            });
            return { unit: 'month', buckets: Array.from(byMonth.values()) };
        }

        function topRoundedPath(x, y, w, h, r) {
            r = Math.max(0, Math.min(r, w / 2, h));
            const f = (v) => v.toFixed(2);
            if (r === 0) return 'M' + f(x) + ' ' + f(y + h) + 'V' + f(y) + 'H' + f(x + w) + 'V' + f(y + h) + 'Z';
            return 'M' + f(x) + ' ' + f(y + h)
                + 'V' + f(y + r)
                + 'A' + f(r) + ' ' + f(r) + ' 0 0 1 ' + f(x + r) + ' ' + f(y)
                + 'H' + f(x + w - r)
                + 'A' + f(r) + ' ' + f(r) + ' 0 0 1 ' + f(x + w) + ' ' + f(y + r)
                + 'V' + f(y + h) + 'Z';
        }

        function drawDailyChart(animate) {
            const el = document.getElementById('dailyChart');
            if (!el || !lastData || !lastData.daily || !lastData.daily.length) return;
            const W = Math.max(240, Math.floor(el.clientWidth));
            if (!animate && W === dailyWidth && el.firstChild) return;
            dailyWidth = W;
            const H = W < 520 ? 220 : 260;
            const pt = 18;
            const pb = 26;
            const pr = 2;
            const maxTicks = H < 260 ? 4 : 5;
            const grouped = bucketDaily(lastData.daily, Math.max(4, Math.floor((W - 44 - pr) / 6)));
            const buckets = grouped.buckets;
            dailyBuckets = buckets;
            const n = buckets.length;
            const maxTotal = Math.max(...buckets.map((b) => b.success + b.failed));
            const scale = niceScale(maxTotal, maxTicks);
            const pl = Math.ceil(textWidth(scale.top.toLocaleString(), 11) + 10);
            const plotW = W - pl - pr;
            const plotH = H - pt - pb;
            const top = scale.top;
            const slot = plotW / n;
            const barW = Math.min(24, Math.max(2, slot - Math.max(2, slot * 0.38)));
            const yOf = (v) => pt + plotH - (v / top) * plotH;
            const baseY = Math.round(pt + plotH) + 0.5;

            let grid = '';
            for (let val = 0; val <= top; val += scale.step) {
                const y = Math.round(yOf(val)) + 0.5;
                if (val > 0) grid += '<line class="grid-line" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '"/>';
                grid += '<text x="' + (pl - 8) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + esc(val.toLocaleString()) + '</text>';
            }
            grid += '<line class="base-line" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + baseY + '" y2="' + baseY + '"/>';

            let peakIdx = -1;
            let peakVal = 0;
            buckets.forEach((b, i) => {
                if (b.success + b.failed > peakVal) {
                    peakVal = b.success + b.failed;
                    peakIdx = i;
                }
            });

            const delayStep = Math.min(14, 420 / Math.max(1, n));
            let cols = '';
            buckets.forEach((b, i) => {
                const sx = pl + i * slot;
                const x = sx + (slot - barW) / 2;
                const base = pt + plotH;
                let sH = b.success ? Math.max(1.5, (b.success / top) * plotH) : 0;
                let fH = b.failed ? Math.max(1.5, (b.failed / top) * plotH) : 0;
                const gap = sH && fH ? 2 : 0;
                let bars = '';
                if (sH) {
                    bars += '<path class="mark-success" d="' + topRoundedPath(x, base - sH, barW, sH, fH ? 0 : 4) + '"/>';
                }
                if (fH) {
                    bars += '<path class="mark-failed" d="' + topRoundedPath(x, base - sH - gap - fH, barW, fH, 4) + '"/>';
                }
                cols += '<g class="col" data-i="' + i + '">'
                    + '<rect class="col-band" x="' + sx.toFixed(2) + '" y="' + pt + '" width="' + slot.toFixed(2) + '" height="' + plotH + '" rx="3"/>'
                    + (bars ? '<g class="col-bars" style="--d:' + Math.round(i * delayStep) + 'ms">' + bars + '</g>' : '')
                    + '<rect class="col-hit" x="' + sx.toFixed(2) + '" y="' + pt + '" width="' + slot.toFixed(2) + '" height="' + (plotH + pb) + '"/>'
                    + '</g>';
            });

            let peak = '';
            if (peakIdx >= 0 && peakVal > 0) {
                const cx = pl + peakIdx * slot + slot / 2;
                const label = peakVal.toLocaleString();
                const lw = textWidth(label, 11, 600);
                const lx = Math.min(Math.max(cx, pl + lw / 2), W - pr - lw / 2);
                const failedH = buckets[peakIdx].failed && buckets[peakIdx].success ? 2 : 0;
                const ly = yOf(peakVal) - failedH - 5;
                peak = '<text class="peak-label" x="' + lx.toFixed(1) + '" y="' + Math.max(10, ly).toFixed(1) + '" text-anchor="middle">' + esc(label) + '</text>';
            }

            let xlabels = '';
            const minGap = 14;
            let lastRight = -Infinity;
            const candidates = [];
            const approx = Math.max(...buckets.map((b) => textWidth(b.short, 11))) + minGap;
            const every = Math.max(1, Math.ceil(approx / slot));
            for (let i = 0; i < n; i += every) candidates.push(i);
            if (candidates[candidates.length - 1] !== n - 1) candidates.push(n - 1);
            candidates.forEach((i) => {
                const text = buckets[i].short;
                const w = textWidth(text, 11);
                let cx = pl + i * slot + slot / 2;
                cx = Math.min(Math.max(cx, pl + w / 2), W - pr - w / 2);
                const left = cx - w / 2;
                if (left < lastRight + minGap) return;
                lastRight = cx + w / 2;
                xlabels += '<text x="' + cx.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(text) + '</text>';
            });

            const totS = buckets.reduce((s, b) => s + b.success, 0);
            const totF = buckets.reduce((s, b) => s + b.failed, 0);
            el.innerHTML = '<svg class="chart-svg' + (animate ? ' is-animated' : '') + '" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '"'
                + ' role="img" aria-label="' + esc('Stacked columns per ' + grouped.unit + ': ' + totS.toLocaleString() + ' downloaded and ' + totF.toLocaleString() + ' failed tracks. Use the table view for exact values.') + '">'
                + grid + cols + peak + xlabels + '</svg>';
            el.dataset.unit = grouped.unit;
            renderDailyTable(grouped);
        }

        function renderDailyTable(grouped) {
            const host = document.getElementById('dailyTable');
            if (!host) return;
            const unitHead = { day: 'Day', week: 'Week', month: 'Month' }[grouped.unit];
            const rows = grouped.buckets.map((b) => '<tr><td>' + esc(b.full) + '</td><td class="num">' + fmtInt(b.success) + '</td><td class="num">' + fmtInt(b.failed) + '</td><td class="num">' + fmtInt(b.success + b.failed) + '</td></tr>').join('');
            host.innerHTML = '<div class="ui-table-wrap"><table class="ui-table"><caption>Track downloads per ' + grouped.unit + '</caption>'
                + '<thead><tr><th scope="col">' + unitHead + '</th><th scope="col" class="num">Downloaded</th><th scope="col" class="num">Failed</th><th scope="col" class="num">Total</th></tr></thead>'
                + '<tbody>' + rows + '</tbody></table></div>';
        }

        function buildStats(t) {
            const tile = (icon, label, value, meta) => '<div class="ui-stat"><div class="ui-stat-label">' + UI.icon(icon) + '<span>' + label + '</span></div>'
                + '<div class="ui-stat-value">' + esc(value) + '</div><div class="ui-stat-meta"><span>' + esc(meta) + '</span></div></div>';
            return '<section class="ui-stats" aria-label="Summary">'
                + tile('music', 'Tracks downloaded', fmtInt(t.successful), 'of ' + fmtInt(t.total_tracks) + ' attempted')
                + tile('check-circle', 'Success rate', t.success_rate + '%', fmtInt(t.failed) + ' failed')
                + tile('disc', 'Albums', fmtInt(t.distinct_albums), fmtInt(t.distinct_artists) + (t.distinct_artists === 1 ? ' artist' : ' artists'))
                + tile('clock', 'Downloaded audio', fmtDuration(t.total_duration_seconds), 'Total audio length')
                + '</section>';
        }

        function cardHead(id, icon, title, sub) {
            const pressed = tableViews.has(id);
            return '<div class="chart-head"><div><h2 class="ui-card-title" id="' + id + '-title">' + UI.icon(icon) + esc(title) + '</h2>'
                + '<p class="ui-card-sub">' + esc(sub) + '</p></div>'
                + '<button type="button" class="ui-btn ui-btn-plain ui-btn-sm" data-view-toggle="' + id + '" aria-pressed="' + pressed + '" aria-controls="' + id + '-chart ' + id + '-table">'
                + UI.icon(pressed ? 'chart-bar' : 'table') + '<span>' + (pressed ? 'Chart' : 'Table') + '</span></button></div>';
        }

        function viewAttrs(id, isTable) {
            const shown = tableViews.has(id) === isTable;
            return shown ? '' : ' hidden';
        }

        function buildDailyCard(data) {
            const t = data.totals;
            return '<section class="ui-card chart-card chart-card-wide" aria-labelledby="daily-title">'
                + cardHead('daily', 'chart-bar', 'Downloads over time', 'Successful vs failed track downloads, ' + rangeLabel(data.window_days))
                + '<div id="daily-chart"' + viewAttrs('daily', false) + '>'
                + '<ul class="chart-legend" aria-label="Legend">'
                + '<li class="k-success"><span class="legend-swatch" aria-hidden="true"></span>Downloaded <strong>' + fmtInt(t.successful) + '</strong></li>'
                + '<li class="k-failed"><span class="legend-swatch" aria-hidden="true"></span>Failed <strong>' + fmtInt(t.failed) + '</strong></li>'
                + '</ul>'
                + '<div class="chart-plot" id="dailyChart" tabindex="0" aria-label="Downloads over time chart. Use the arrow keys to read each column."></div>'
                + '</div>'
                + '<div class="chart-table" id="daily-table"' + viewAttrs('daily', true) + '><div id="dailyTable"></div></div>'
                + '</section>';
        }

        function buildDonutCard(data) {
            const t = data.totals;
            const size = 168;
            const sw = 18;
            const r = (size - sw) / 2;
            const c = size / 2;
            const circ = 2 * Math.PI * r;
            const total = t.successful + t.failed;
            const gap = t.successful && t.failed ? 2 : 0;
            let sLen = total ? circ * (t.successful / total) : 0;
            let fLen = total ? circ * (t.failed / total) : 0;
            if (gap) {
                sLen = Math.max(1.5, sLen - gap);
                fLen = Math.max(1.5, fLen - gap);
            }
            const arcs = [];
            if (t.successful) arcs.push({ cls: 'arc-success', len: sLen, off: gap / 2, i: 0 });
            if (t.failed) arcs.push({ cls: 'arc-failed', len: fLen, off: (t.successful ? sLen + gap : 0) + gap / 2, i: 1 });
            const label = t.success_rate + '%';
            const inner = 2 * (r - sw / 2) - 22;
            let fs = 28;
            const w = textWidth(label, fs, 700);
            if (w > inner) fs = Math.max(14, Math.floor(fs * inner / w));
            const arcSvg = arcs.map((a) => '<circle class="donut-arc ' + a.cls + '" data-i="' + a.i + '" cx="' + c + '" cy="' + c + '" r="' + r.toFixed(2) + '" stroke-width="' + sw + '"'
                + ' stroke-dasharray="' + a.len.toFixed(2) + ' ' + circ.toFixed(2) + '" stroke-dashoffset="' + (-a.off).toFixed(2) + '"/>').join('');
            const svg = '<svg class="chart-svg" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" role="img"'
                + ' aria-label="' + esc('Success rate ' + t.success_rate + '%: ' + fmtInt(t.successful) + ' downloaded, ' + fmtInt(t.failed) + ' failed') + '">'
                + '<defs><mask id="donutSweep" maskUnits="userSpaceOnUse" x="0" y="0" width="' + size + '" height="' + size + '">'
                + '<circle class="donut-sweep" cx="' + c + '" cy="' + c + '" r="' + r.toFixed(2) + '" fill="none" stroke="#fff" stroke-width="' + (sw + 4) + '"'
                + ' stroke-dasharray="' + circ.toFixed(2) + ' ' + circ.toFixed(2) + '" transform="rotate(-90 ' + c + ' ' + c + ')" style="--c:' + circ.toFixed(2) + '"/></mask></defs>'
                + '<g mask="url(#donutSweep)"><g transform="rotate(-90 ' + c + ' ' + c + ')">' + arcSvg + '</g></g>'
                + '<text class="donut-center" x="' + c + '" y="' + (c + fs * 0.32).toFixed(1) + '" text-anchor="middle" style="font-size:' + fs + 'px">' + esc(label) + '</text>'
                + '<text x="' + c + '" y="' + (c + fs * 0.32 + 17).toFixed(1) + '" text-anchor="middle">success</text>'
                + '</svg>';
            const legend = '<ul class="donut-legend" aria-label="Legend">'
                + '<li class="k-success"><span class="legend-swatch" aria-hidden="true"></span><span>Downloaded</span><span class="legend-num">' + fmtInt(t.successful) + '</span><span class="legend-pct">' + fmtPct(t.successful, total) + '</span></li>'
                + '<li class="k-failed"><span class="legend-swatch" aria-hidden="true"></span><span>Failed</span><span class="legend-num">' + fmtInt(t.failed) + '</span><span class="legend-pct">' + fmtPct(t.failed, total) + '</span></li>'
                + '<li class="is-total"><span class="legend-swatch is-blank" aria-hidden="true"></span><span>Total attempted</span><span class="legend-num">' + fmtInt(t.total_tracks) + '</span><span class="legend-pct"></span></li>'
                + '</ul>';
            const table = '<div class="ui-table-wrap"><table class="ui-table"><caption>Track attempts by outcome</caption>'
                + '<thead><tr><th scope="col">Outcome</th><th scope="col" class="num">Tracks</th><th scope="col" class="num">Share</th></tr></thead><tbody>'
                + '<tr><td>Downloaded</td><td class="num">' + fmtInt(t.successful) + '</td><td class="num">' + fmtPct(t.successful, total) + '</td></tr>'
                + '<tr><td>Failed</td><td class="num">' + fmtInt(t.failed) + '</td><td class="num">' + fmtPct(t.failed, total) + '</td></tr>'
                + '<tr><td>Total attempted</td><td class="num">' + fmtInt(t.total_tracks) + '</td><td class="num">100%</td></tr>'
                + '</tbody></table></div>';
            return '<section class="ui-card chart-card" aria-labelledby="donut-title">'
                + cardHead('donut', 'check-circle', 'Success rate', 'Track attempts, ' + rangeLabel(data.window_days))
                + '<div id="donut-chart" class="donut-wrap"' + viewAttrs('donut', false) + '>'
                + '<div class="chart-plot donut-plot" id="donutChart" tabindex="0" aria-label="Success rate chart. Use the arrow keys to read each segment.">' + svg + '</div>'
                + legend + '</div>'
                + '<div class="chart-table" id="donut-table"' + viewAttrs('donut', true) + '>' + table + '</div>'
                + '</section>';
        }

        function buildHBarCard(id, icon, title, sub, items, labelKey, colHead, withShare) {
            const total = items.reduce((s, x) => s + (x.count || 0), 0);
            const max = Math.max(1, ...items.map((x) => x.count || 0));
            let body;
            if (!items.length) {
                body = '<p class="chart-empty">No successful downloads in this range yet.</p>';
            } else {
                const step = Math.min(50, 480 / items.length);
                body = '<ol class="hbars chart-plot" id="' + id + 'Chart" tabindex="0" aria-label="' + esc(title + ' chart. Use the arrow keys to read each bar.') + '">'
                    + items.map((x, i) => '<li class="hbar" data-i="' + i + '">'
                        + '<span class="hbar-label" title="' + esc(x[labelKey]) + '" dir="auto">' + esc(x[labelKey] || 'Unknown') + '</span>'
                        + '<span class="hbar-area"><span class="hbar-fill" style="--p:' + ((x.count || 0) / max).toFixed(4) + ';--d:' + Math.round(i * step) + 'ms"></span>'
                        + '<span class="hbar-value">' + fmtInt(x.count) + '</span></span></li>').join('')
                    + '</ol>';
            }
            const table = '<div class="ui-table-wrap"><table class="ui-table"><caption>' + esc(title) + '</caption>'
                + '<thead><tr><th scope="col">' + esc(colHead) + '</th><th scope="col" class="num">Tracks</th>' + (withShare ? '<th scope="col" class="num">Share</th>' : '') + '</tr></thead><tbody>'
                + (items.length ? items.map((x) => '<tr><td dir="auto">' + esc(x[labelKey] || 'Unknown') + '</td><td class="num">' + fmtInt(x.count) + '</td>' + (withShare ? '<td class="num">' + fmtPct(x.count, total) + '</td>' : '') + '</tr>').join('')
                    : '<tr><td colspan="' + (withShare ? 3 : 2) + '">No data</td></tr>')
                + '</tbody></table></div>';
            return '<section class="ui-card chart-card' + (id === 'artists' ? ' chart-card-wide' : '') + '" aria-labelledby="' + id + '-title">'
                + cardHead(id, icon, title, sub)
                + '<div id="' + id + '-chart"' + viewAttrs(id, false) + '>' + body + '</div>'
                + '<div class="chart-table" id="' + id + '-table"' + viewAttrs(id, true) + '>' + table + '</div>'
                + '</section>';
        }

        function wireCharts(data) {
            const t = data.totals;
            const total = t.successful + t.failed;
            const daily = document.getElementById('dailyChart');
            if (daily) {
                attachInspector(daily, {
                    count: () => dailyBuckets.length,
                    initial: () => {
                        for (let i = dailyBuckets.length - 1; i >= 0; i--) if (dailyBuckets[i].success + dailyBuckets[i].failed) return i;
                        return dailyBuckets.length - 1;
                    },
                    anchor: (i) => daily.querySelector('[data-i="' + i + '"] .col-bars') || daily.querySelector('[data-i="' + i + '"]'),
                    content: (i) => {
                        const b = dailyBuckets[i];
                        return {
                            title: b.full,
                            rows: [
                                { k: 'k-success', value: fmtInt(b.success), name: 'Downloaded' },
                                { k: 'k-failed', value: fmtInt(b.failed), name: 'Failed' },
                                { k: '', value: fmtInt(b.success + b.failed), name: 'Total' },
                            ],
                        };
                    },
                });
            }
            const donut = document.getElementById('donutChart');
            if (donut) {
                const segs = [];
                if (t.successful) segs.push(0);
                if (t.failed) segs.push(1);
                attachInspector(donut, {
                    count: () => segs.length,
                    initial: () => 0,
                    anchor: () => donut,
                    onActive: (i) => donut.classList.toggle('has-active', i >= 0),
                    content: (pos) => {
                        const i = segs[pos] !== undefined ? segs[pos] : pos;
                        const isS = i === 0;
                        return {
                            title: isS ? 'Downloaded' : 'Failed',
                            rows: [{ k: isS ? 'k-success' : 'k-failed', value: fmtInt(isS ? t.successful : t.failed), name: fmtPct(isS ? t.successful : t.failed, total) + ' of attempts' }],
                        };
                    },
                });
                donut.querySelectorAll('.donut-arc').forEach((arc) => {
                    arc.dataset.i = String(segs.indexOf(Number(arc.dataset.i)));
                });
            }
            [['quality', data.quality, 'label', true], ['artists', data.top_artists, 'artist', false]].forEach(([id, items, key, share]) => {
                const el = document.getElementById(id + 'Chart');
                if (!el) return;
                const qTotal = items.reduce((s, x) => s + (x.count || 0), 0);
                attachInspector(el, {
                    count: () => items.length,
                    initial: () => 0,
                    anchor: (i) => el.querySelector('[data-i="' + i + '"] .hbar-fill'),
                    content: (i) => ({
                        title: items[i][key] || 'Unknown',
                        rows: [{ k: 'k-accent', value: fmtInt(items[i].count), name: share ? 'tracks · ' + fmtPct(items[i].count, qTotal) : (items[i].count === 1 ? 'track downloaded' : 'tracks downloaded') }],
                    }),
                });
            });
        }

        function render(data, animate) {
            lastData = data;
            const t = data.totals;
            const body = document.getElementById('insightsBody');
            hideTip();
            if (!t.total_tracks) {
                const wider = data.window_days < 365;
                body.innerHTML = '<div class="insights-state"><div class="ui-empty">'
                    + '<div class="ui-empty-art" aria-hidden="true"><svg viewBox="0 0 88 88" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 72h56"/><path d="M24 72V52M38 72V36M52 72V44M66 72V24"/></svg></div>'
                    + '<h2 class="ui-empty-title">No download history ' + (wider ? 'in the ' + esc(rangeLabel(data.window_days)) : 'yet') + '</h2>'
                    + '<p class="ui-empty-text">Queue some albums and your insights will appear here.</p>'
                    + '<div class="ui-empty-actions">'
                    + (wider ? '<button type="button" class="ui-btn ui-btn-secondary" data-set-days="365">Show the last year</button>' : '')
                    + '<a class="ui-btn ui-btn-primary" href="/">' + UI.icon('home') + '<span>Go to Library</span></a></div>'
                    + '</div></div>';
                setStatus('No download history for the ' + (rangeLabel(data.window_days)));
                return;
            }
            const anim = animate && !UI.prefersReducedMotion();
            body.innerHTML = buildStats(t)
                + '<div class="insights-grid' + (anim ? ' is-animated' : '') + '">'
                + buildDailyCard(data)
                + buildDonutCard(data)
                + buildHBarCard('quality', 'headphones', 'Audio quality', 'Source stream container of downloaded tracks, ' + rangeLabel(data.window_days), data.quality, 'label', 'Container', true)
                + buildHBarCard('artists', 'star', 'Top artists', 'Most downloaded artists, ' + rangeLabel(data.window_days), data.top_artists, 'artist', 'Artist', false)
                + '</div>';
            dailyWidth = 0;
            drawDailyChart(anim);
            wireCharts(data);
            setStatus('Insights for the ' + (rangeLabel(data.window_days)) + ': ' + fmtInt(t.successful) + ' tracks downloaded, ' + t.success_rate + '% success rate');
            observeResize();
        }

        function observeResize() {
            const el = document.getElementById('dailyChart');
            if (!el) return;
            if (resizeObs) resizeObs.disconnect();
            let timer = null;
            const redraw = () => {
                clearTimeout(timer);
                timer = setTimeout(() => {
                    hideTip();
                    drawDailyChart(false);
                }, 120);
            };
            if ('ResizeObserver' in window) {
                let first = true;
                resizeObs = new ResizeObserver(() => {
                    if (first) {
                        first = false;
                        return;
                    }
                    redraw();
                });
                resizeObs.observe(el);
            } else {
                window.addEventListener('resize', redraw);
            }
        }

        function setStatus(text) {
            const el = document.getElementById('insightsStatus');
            if (el.textContent !== text) el.textContent = text;
        }

        function renderSkeleton() {
            let stats = '';
            for (let i = 0; i < 4; i++) stats += '<div class="ui-skeleton skel-stat"></div>';
            document.getElementById('insightsBody').innerHTML = '<div aria-hidden="true"><div class="ui-stats">' + stats + '</div>'
                + '<div class="insights-grid"><div class="ui-skeleton skel-card chart-card-wide"></div><div class="ui-skeleton skel-card"></div><div class="ui-skeleton skel-card"></div></div></div>';
            setStatus('Loading insights…');
        }

        function renderError() {
            document.getElementById('insightsBody').innerHTML = '<div class="insights-state"><div class="ui-empty" role="alert">'
                + '<div class="ui-empty-art" aria-hidden="true"><svg viewBox="0 0 88 88" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M28 62h34a14 14 0 0 0 2-27.8A20 20 0 0 0 25 38a12 12 0 0 0 3 24z"/><path d="M44 42v8M44 56h.01"/></svg></div>'
                + '<h2 class="ui-empty-title">Could not load insights</h2>'
                + '<p class="ui-empty-text">The server did not respond. Check that the app is running, then try again.</p>'
                + '<div class="ui-empty-actions"><button type="button" class="ui-btn ui-btn-secondary" id="insightsRetry">' + UI.icon('refresh') + '<span>Retry</span></button></div>'
                + '</div></div>';
            setStatus('Could not load insights');
        }

        async function loadInsights() {
            const days = currentDays;
            const seq = ++insightsSeq;
            const body = document.getElementById('insightsBody');
            const holdFrame = !!(lastData && lastData.totals && lastData.totals.total_tracks && body.querySelector('.insights-grid'));
            if (holdFrame) {
                body.classList.add('is-refreshing');
                body.setAttribute('aria-busy', 'true');
            } else {
                renderSkeleton();
            }
            try {
                const res = await fetch('/api/insights?days=' + encodeURIComponent(days));
                if (!res.ok) throw new Error('Server error ' + res.status);
                const data = await res.json();
                if (seq !== insightsSeq) return;
                body.classList.remove('is-refreshing');
                body.removeAttribute('aria-busy');
                render(data, true);
            } catch (e) {
                if (seq !== insightsSeq) return;
                body.classList.remove('is-refreshing');
                body.removeAttribute('aria-busy');
                lastData = null;
                renderError();
            }
        }

        function setDays(days) {
            days = Number(days);
            if (!RANGE_LABEL[days]) return;
            document.querySelectorAll('#windowSelect [data-days]').forEach((b) => {
                b.setAttribute('aria-pressed', Number(b.dataset.days) === days ? 'true' : 'false');
            });
            if (days === currentDays && lastData) return;
            currentDays = days;
            loadInsights();
        }

        function toggleView(id) {
            const showTable = !tableViews.has(id);
            if (showTable) tableViews.add(id); else tableViews.delete(id);
            const chart = document.getElementById(id + '-chart');
            const table = document.getElementById(id + '-table');
            if (chart) chart.hidden = showTable;
            if (table) table.hidden = !showTable;
            const btn = document.querySelector('[data-view-toggle="' + id + '"]');
            if (btn) {
                btn.setAttribute('aria-pressed', showTable ? 'true' : 'false');
                btn.innerHTML = UI.icon(showTable ? 'chart-bar' : 'table') + '<span>' + (showTable ? 'Chart' : 'Table') + '</span>';
            }
            hideTip();
            if (!showTable && id === 'daily') {
                dailyWidth = 0;
                drawDailyChart(false);
            }
        }

        function init() {
            document.getElementById('windowSelect').addEventListener('click', (e) => {
                const b = e.target.closest('[data-days]');
                if (b) setDays(b.dataset.days);
            });
            document.getElementById('insightsBody').addEventListener('click', (e) => {
                const tgl = e.target.closest('[data-view-toggle]');
                if (tgl) {
                    toggleView(tgl.dataset.viewToggle);
                    return;
                }
                const d = e.target.closest('[data-set-days]');
                if (d) {
                    setDays(d.dataset.setDays);
                    return;
                }
                if (e.target.closest('#insightsRetry')) loadInsights();
            });
            window.addEventListener('scroll', hideTip, { passive: true });
            loadInsights();
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    </script>
</body>
</html>
